name: combat_connect
description: Combat Connect - Built for Martial Arts. Designed for Growth.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.1
  data_table_2: ^2.6.0
  flex_color_scheme: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/artwork/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-VariableFont_wght.ttf